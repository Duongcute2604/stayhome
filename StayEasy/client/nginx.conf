# ============================================================================
# STAYEASY FRONTEND - NGINX CONFIGURATION
# ============================================================================
# Mục đích: Cấu hình Nginx serve ứng dụng React SPA
# ============================================================================

server {
    listen 80;
    server_name localhost;

    # Thư mục gốc chứa file tĩnh
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # SPA ROUTING - Quan trọng cho React Router
    # ==========================================================================
    # Tại sao cần: Khi user refresh trang /rooms/123, Nginx cần trả về index.html
    #              để React Router xử lý, không phải tìm file /rooms/123
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # API PROXY - Chuyển tiếp request API sang backend
    # ==========================================================================
    # Tại sao cần: Tránh CORS, frontend chỉ cần gọi /api
    # ==========================================================================
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================================
    # SECURITY HEADERS - Header bảo mật cơ bản
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================================================
    # GZIP COMPRESSION - Nén file giảm băng thông
    # ==========================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
